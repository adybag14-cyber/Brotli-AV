[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brotli-av"
version = "0.1.0"
description = "Brotli-AV: advanced research compressor aiming to beat Google Brotli on ratio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "brotli==1.2.0",
  "zstandard==0.25.0",
]

[project.scripts]
bav = "bav.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
